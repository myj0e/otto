[package]
name = "otto"
version = "1.5.0"
edition = "2021"
rust-version = "1.89"
description = "One-time.Talk once CLI assistant"
publish = false

[[bin]]
name = "otto"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
libc = "0.2"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
futures-util = "0.3"
getrandom = "0.4"
globset = "0.4"
regex = "1"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = [
  "brotli",
  "deflate",
  "gzip",
  "json",
  "rustls-tls",
  "socks",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.25"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
unicode-width = "0.2"
walkdir = "2"
